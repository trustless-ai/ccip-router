name: release

# Why this exists: npm sat on 0.7.0 for three months while main was on 0.8.0, because
# publishing was a manual step and nothing failed when nobody ran it. The drift was not
# cosmetic — 0.7.0 predates the ERC-8309 divergence-preservation work (1caf220, e1ba6fd),
# so every `npm i ccip-router` shipped a node that keys attestation retention by inputHash.
# Such a node reads legitimate multi-vantage attestations as equivocation: it drops them and
# flags the honest peer for slashing. A mesh node ran that way for months and silently held
# 299 of the origin's 413 records.
#
# So this job exists to make "the repo says 0.8.0" and "npm says 0.8.0" the same statement.
# The guards below are the point, not the publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: install (locked)
        run: npm ci

      # Guard 1 — the tag must be the version being published.
      # Tagging v0.9.0 while package.json still says 0.8.0 would publish 0.8.0 under a
      # release called 0.9.0, and nothing downstream would notice.
      - name: tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG — refusing to publish"
            exit 1
          fi

      # Guard 2 — never republish an existing version. Makes a re-run of a failed job safe
      # instead of failing on a 403 that looks like a credentials problem.
      - name: version not already published
        id: exists
        run: |
          PKG="$(node -p "require('./package.json').version")"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/ccip-router/$PKG")
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ccip-router@$PKG is already on npm — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: typecheck
        if: steps.exists.outputs.already == 'false'
        run: npm run lint

      - name: test
        if: steps.exists.outputs.already == 'false'
        run: npm test

      - name: build
        if: steps.exists.outputs.already == 'false'
        run: npm run build

      # --provenance publishes a signed attestation tying the tarball to this workflow run
      # and commit. For a package whose whole argument is "recompute, don't trust", shipping
      # an artifact nobody can trace back to a source commit would be the wrong default.
      #
      # NPM_TOKEN must be a GRANULAR access token with "Bypass 2FA" enabled. A classic
      # automation token authenticates fine and then fails the publish with
      # "403 ... two-factor authentication or granular access token with bypass 2fa enabled
      # is required", which reads like a permissions problem and is not one.
      - name: publish
        if: steps.exists.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Guard 3 — npm prints "+ ccip-router@x.y.z" and warns the version "may take a few
      # minutes to become available". Those are different claims. A job that goes green on
      # the first one reports a publish that may not have landed, so wait for the registry
      # to actually serve it.
      - name: verify it is really on the registry
        if: steps.exists.outputs.already == 'false'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/ccip-router/$PKG")
            if [ "$CODE" = "200" ]; then
              echo "ccip-router@$PKG is live on the registry"
              exit 0
            fi
            echo "not yet visible (attempt $i/30, HTTP $CODE)"; sleep 20
          done
          echo "::error::published but ccip-router@$PKG never became retrievable — check npmjs.com"
          exit 1
